name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit shouldn't leave the old run
# grinding away — cancel it, except on main where every commit's result is
# worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Lint and typecheck once rather than per Node version: neither depends on
  # the runtime, and three copies of the same failure helps nobody.
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Enforced from the commit that swept the tree. It was left off while the
      # backlog grew, which is exactly how it reached 25 files — the gate is
      # cheap only while nothing has drifted past it. `npm run format` fixes.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing is worth knowing about even if another already
      # has; a half-reported matrix sends you looking in the wrong place.
      fail-fast: false
      matrix:
        # The ends of the range engines declares (>=22.13.0), plus current.
        # 22.13 is the floor `node:sqlite` imposes — it exists from 22.5 but
        # only without --experimental-sqlite from 22.13 — and it's the one most
        # likely to break silently, since nobody develops on it.
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # The live suite talks to a real ACSM and is opt-in via
      # CHAMPCTL_LIVE_URL, which CI doesn't set. Running it here proves it
      # skips cleanly rather than erroring — otherwise nothing would notice
      # that gate breaking until someone tried to use the harness.
      - name: Live suite skips without a container
        run: npm run test:live --if-present

  # The live suite against a real Server Manager.
  #
  # The *public* build, because it is the only one CI can run: 2.4.x refuses to
  # start without a per-purchase ACSM.License, which cannot go in a public
  # repo, and 1.7.x needs neither that nor a Steam account. Without this job
  # the live suite is something someone remembers to run, and the bugs it has
  # caught — a finalize that silently dropped every session, an archive that
  # listed nothing and exited 0 — are all invisible to `npm test`.
  #
  # It does not cover the premium differences. Those need a licensed zip and a
  # human; docs/acsm-oss-vs-premium.md lists what differs and how each one is
  # decided, and most are read off the response rather than off a version, so
  # this job exercises the same code paths BATL's server takes.
  live-oss:
    name: Live suite (Server Manager 1.7.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Keyed on the pinned version, so a bump downloads once and every later
      # run on that version is cache-only. The checksum in oss.sh is checked
      # whether the zip came from the cache or the network — a poisoned cache
      # entry is exactly the case a pin exists for.
      # v5, not v4. v4 ships a Node 20 runtime, which GitHub has deprecated —
      # the runner forces it onto 24 and prints a warning on every run. That is
      # the *action's* runtime, nothing to do with the Node this project builds
      # on, which the setup-node step above pins.
      - name: Cache the Server Manager release
        uses: actions/cache@v5
        with:
          path: .harness/oss-1.7.9/server-manager.zip
          key: acsm-oss-1.7.9

      - name: Start Server Manager
        run: npm run harness:oss -- start

      - name: Provision it
        env:
          CHAMPCTL_LIVE_URL: http://127.0.0.1:8772
          CHAMPCTL_LIVE_USERNAME: admin
          CHAMPCTL_LIVE_PASSWORD: champctl-ci-not-a-secret
        run: npm run harness:provision

      # Once, with a machine-readable result.
      #
      # The suite skips silently without CHAMPCTL_LIVE_URL, so a job that failed
      # to set it would pass having run nothing — vitest exits 0 for "no tests
      # matched". The count is what turns a green tick into a green tick that
      # means something.
      #
      # Read from the JSON reporter rather than grepped out of the human
      # output. That is not tidiness: vitest writes ANSI colour codes even
      # through a pipe, so `Tests  35 passed` is really
      # `Tests  \e[1m\e[32m35 passed`, and a pattern that looks right in the
      # rendered log never matches the bytes. Under `bash -e` the failed grep
      # then killed the step *after* 35 tests had passed, which is the worst
      # kind of CI failure: correct code, red build, nothing in the log saying
      # why.
      - name: Live suite
        env:
          CHAMPCTL_LIVE_URL: http://127.0.0.1:8772
          CHAMPCTL_LIVE_USERNAME: admin
          CHAMPCTL_LIVE_PASSWORD: champctl-ci-not-a-secret
        run: npm run test:live -- --reporter=default --reporter=json --outputFile=live.json

      - name: Prove the suite actually ran
        run: node scripts/harness/assert-live-ran.mjs live.json

      - name: Server Manager log
        if: failure()
        run: tail -100 .harness/oss-1.7.9/run/server-manager.out || true

      - name: Stop Server Manager
        if: always()
        run: npm run harness:oss -- stop
