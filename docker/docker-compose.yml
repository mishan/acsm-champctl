# Local ACSM for development and recon.
#
# This exists so the plan's §3.4 recon list stops being manual devtools work.
# Nothing here should ever point at a league's real manager — see SAFETY in
# docker/README.md.
#
#   cd docker && cp .env.example .env && docker compose up -d
#
# Default service runs the premium build from an image you supply, because that
# is what BATL runs. The `oss` profile runs the public image instead; see
# docker/README.md for what it can and can't tell you.

name: champctl-acsm

services:
  acsm:
    # No `profiles` key, so this is what `docker compose up` starts.
    image: ${ACSM_IMAGE:-champctl/acsm-premium:local}
    # A build section, so `docker compose build` (npm run harness:build) and
    # `up --build` work. Without it compose silently reuses a stale image, and
    # a tool added to the Dockerfile shows up as "executable file not found in
    # $PATH" at run time with no hint that a rebuild was needed.
    build:
      context: .
      dockerfile: Dockerfile.premium
      args:
        # Which zip in docker/premium/ to build from, matched as a substring of
        # the filename. Only needed when there is more than one; with a single
        # zip it is ignored. BATL runs 2.4.5.
        ACSM_VERSION: ${ACSM_VERSION:-}
    container_name: champctl-acsm
    restart: unless-stopped
    environment:
      # Read by entrypoint.sh, which renders config.template.yml into
      # config.yml at boot.
      #
      # Blank only works once an Assetto Corsa server is already in the
      # acsm-data volume — after `npm run harness:steam-login-qr`, which is the
      # recommended route since it needs no password anywhere. Otherwise set
      # them and Server Manager installs one via steamcmd on first boot. On a
      # fresh volume with neither, the entrypoint refuses to start and says so.
      STEAM_USERNAME: ${STEAM_USERNAME:-}
      STEAM_PASSWORD: ${STEAM_PASSWORD:-}
      STEAM_FORCE_UPDATE: ${STEAM_FORCE_UPDATE:-false}
    ports:
      # Server Manager web UI. Bound to loopback by default: this container
      # holds an admin account with a known password and must not be exposed
      # to a network you don't control.
      - "${BIND_ADDR:-127.0.0.1}:${ACSM_PORT:-8772}:8772"
      # The Assetto Corsa server itself. Only needed if you actually start a
      # session, which the recon and round-trip work does not.
      - "${BIND_ADDR:-127.0.0.1}:9600:9600"
      - "${BIND_ADDR:-127.0.0.1}:9600:9600/udp"
      - "${BIND_ADDR:-127.0.0.1}:8081:8081"
    volumes:
      # The template, not config.yml — the entrypoint renders the real one.
      - ./config.template.yml:/home/assetto/server-manager/config.template.yml:ro
      # Named volumes rather than bind mounts so `docker compose down -v`
      # genuinely resets the manager to a clean slate between recon runs. Note
      # that also throws away a steamcmd install, so if you have credentials
      # configured the next boot re-downloads the AC server.
      - acsm-data:/home/assetto/server-manager/assetto
      - acsm-db:/home/assetto/server-manager/db
      - acsm-steam:/home/assetto/steamcmd
      # DepotDownloader's remembered session, for the QR login path.
      - acsm-depotdownloader:/home/assetto/depotdownloader
    healthcheck:
      # /healthcheck.json is unauthenticated in every build, which makes it the
      # only probe available without credentials — but note what it does not
      # cover. Measured on 2.4.15 with the store path pointing at a directory
      # that did not exist: every page returned "Failed to initialise server
      # manager ... Open server manager storage", and this endpoint answered
      # 200 throughout. Healthy here means the HTTP server is listening, not
      # that the manager works. `npm run harness:provision` is the real check,
      # because it has to log in and drive a form to succeed.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8772/healthcheck.json || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      # Generous: a first boot with steam credentials downloads the AC server
      # before the UI comes up.
      start_period: 60s

  # Public build. Useful for checking that champctl degrades sanely on the
  # version most other leagues run.
  acsm-oss:
    # Pinned, not :latest. This profile exists to produce comparable recon
    # captures, and a floating tag means an answer can change with no commit
    # to point at. v1.7.9 is the last public release (Feb 2021) and is what
    # :latest resolves to today; override ACSM_OSS_IMAGE to move deliberately.
    image: ${ACSM_OSS_IMAGE:-seejy/assetto-server-manager:v1.7.9}
    profiles: ["oss"]
    container_name: champctl-acsm-oss
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ACSM_OSS_PORT:-8773}:8772"
    volumes:
      # Its own plain config: the upstream image has its own entrypoint, so
      # nothing would render the template for this service.
      - ./config.oss.yml:/home/assetto/server-manager/config.yml:ro
      - acsm-oss-data:/home/assetto/server-manager/assetto
      - acsm-oss-db:/home/assetto/server-manager/db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8772/healthcheck.json || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  acsm-data:
  acsm-db:
  acsm-steam:
  acsm-depotdownloader:
  acsm-oss-data:
  acsm-oss-db:
